name: Apply authoritative job completion recovery

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix authoritative job completion recovery [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch API client
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('MyChatIOS/APIClient.swift')
          text = path.read_text()
          old = '''    func eventStream(_ accepted: ChatEnqueueResponse) -> AsyncThrowingStream<JobEvent, Error> {
              AsyncThrowingStream { continuation in
                  let task = Task {
                      do {
                          try await consumeEvents(accepted, continuation: continuation)
                          continuation.finish()
                      } catch {
                          continuation.finish(throwing: localizedNetworkError(error, host: baseURL.host))
                      }
                  }
                  continuation.onTermination = { _ in task.cancel() }
              }
          }
          '''
          new = '''    func eventStream(_ accepted: ChatEnqueueResponse) -> AsyncThrowingStream<JobEvent, Error> {
              AsyncThrowingStream { continuation in
                  let task = Task {
                      let deadline = Date().addingTimeInterval(20 * 60)
                      let completed = await withTaskGroup(of: Bool.self, returning: Bool.self) { group in
                          group.addTask {
                              do {
                                  try await self.consumeEvents(accepted, continuation: continuation)
                                  return true
                              } catch {
                                  return false
                              }
                          }
                          group.addTask {
                              var sequence = 0
                              do {
                                  return try await self.pollJobUntilTerminal(
                                      accepted.jobId,
                                      sequence: &sequence,
                                      deadline: deadline,
                                      continuation: continuation
                                  )
                              } catch {
                                  return false
                              }
                          }
                          while let result = await group.next() {
                              if result {
                                  group.cancelAll()
                                  return true
                              }
                          }
                          return false
                      }
                      if completed {
                          continuation.finish()
                      } else if !Task.isCancelled {
                          continuation.finish(throwing: APIError.message("回复恢复失败，请重试"))
                      }
                  }
                  continuation.onTermination = { _ in task.cancel() }
              }
          }
          '''
          if old not in text:
              raise SystemExit('eventStream block did not match current main')
          path.write_text(text.replace(old, new, 1))

          contract = Path('scripts/verify-ui-contract.sh')
          contract_text = contract.read_text()
          check = '''
          event_stream_block="$(sed -n '/func eventStream/,/private func consumeEvents/p' "$repo_root/MyChatIOS/APIClient.swift")"
          if ! printf '%s' "$event_stream_block" | grep -q 'pollJobUntilTerminal'; then
            echo "Authoritative job polling must run alongside SSE"
            exit 1
          fi
          '''
          if 'Authoritative job polling must run alongside SSE' not in contract_text:
              contract.write_text(contract_text.rstrip() + '\n' + check)

          Path('.github/workflows/apply-authoritative-job-race-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix authoritative job completion recovery [applied]'
          git push origin HEAD:main
