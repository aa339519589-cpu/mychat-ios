name: Build 102 NativeApp (manual)

on:
  workflow_dispatch:
    inputs:
      run_offline_tests:
        description: "Run fixture-only runtime tests only if an iPhone 18 Pro with iOS 27 is already installed. No runtime download."
        required: false
        type: boolean
        default: false
      run_dot_position_tests:
        description: "Run only the three synthetic DotCoordinatedTerminalUIKitTests on an already-installed iOS 27 iPhone 18 Pro. Takes precedence over run_offline_tests. No runtime download."
        required: false
        type: boolean
        default: false
      compile_offline_test_targets:
        description: "Compile iOS Simulator app and test targets with build-for-testing only; do not launch the test host or run tests. No runtime download."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build102:
    name: Build 102 NativeApp
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report installed Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available

      - name: Build NativeApp for iOS Simulator
        working-directory: NativeApp
        run: |
          set -o pipefail
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/build102-xcodebuild.log"

      - name: Compile iOS Simulator test targets without running tests
        if: ${{ inputs.compile_offline_test_targets }}
        working-directory: NativeApp
        run: |
          set -o pipefail
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing | tee "$RUNNER_TEMP/build102-test-targets.log"

      - name: Run selected offline runtime tests on an installed iOS 27 simulator
        if: ${{ inputs.run_offline_tests || inputs.run_dot_position_tests }}
        working-directory: NativeApp
        env:
          RUN_DOT_POSITION_TESTS: ${{ inputs.run_dot_position_tests }}
        run: |
          set -euo pipefail
          device_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
          for device in payload.get("devices", {}).get(runtime, []):
              if device.get("isAvailable") and device.get("name") == "iPhone 18 Pro":
                  print(device["udid"])
                  break
          PY
          )"
          if [[ -z "$device_id" ]]; then
            if [[ "$RUN_DOT_POSITION_TESTS" == "true" ]]; then
              echo "::error::The requested Dot UIKit tests require an already-installed iOS 27 iPhone 18 Pro. No runtime download was attempted."
              exit 1
            fi
            echo "::notice::No already-installed iOS 27 iPhone 18 Pro simulator. Tests skipped; no runtime download was attempted."
            exit 0
          fi
          # Boot only the runner-provided simulator; never install a runtime.
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          test_selector="MyChatRuntimeTests"
          if [[ "$RUN_DOT_POSITION_TESTS" == "true" ]]; then
            test_selector="MyChatRuntimeTests/DotCoordinatedTerminalUIKitTests"
          fi
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            "-only-testing:$test_selector" \
            -skip-testing:MyChatRuntimeTests/MyChatRuntimeTests/testOptInLiveCustomEndpointFirstTextTiming \
            test | tee "$RUNNER_TEMP/build102-runtime-tests.log"
          if [[ "$RUN_DOT_POSITION_TESTS" == "true" ]]; then
            python3 - "$RUNNER_TEMP/build102-runtime-tests.log" <<'PY'
          import pathlib
          import re
          import sys

          expected = {
              "testTerminalHandoffPreservesVisiblePositionUntilFramesConverge",
              "testCombinedScrollHandoffIsContinuousInBothConfigurationOrders",
              "testSettledTerminalPlacementHoldsLate24PointLayoutThenConverges",
          }
          log = pathlib.Path(sys.argv[1]).read_text()
          passed = set(re.findall(
              r"Test Case '-\[MyChatRuntimeTests\.DotCoordinatedTerminalUIKitTests ([^\]]+)\]' passed",
              log,
          ))
          if passed != expected:
              raise SystemExit(
                  "Dot UIKit execution was not verified: expected all three methods to pass; "
                  f"observed={sorted(passed)}"
              )
          print("Verified all three DotCoordinatedTerminalUIKitTests passed.")
          PY
          fi
