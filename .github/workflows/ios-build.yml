name: Build 102 NativeApp (manual)

on:
  workflow_dispatch:
    inputs:
      run_offline_tests:
        description: "Run fixture-only runtime tests only if an iPhone 18 Pro with iOS 27 is already installed. No runtime download."
        required: false
        type: boolean
        default: false
      run_offline_summary_tests:
        description: "Run focused fixture-only public-summary, artifact, and SVG-cache runtime tests only on an already-installed iOS 27 iPhone 18 Pro. No runtime download."
        required: false
        type: boolean
        default: false
      run_offline_ui_tests:
        description: "Run focused fixture-only UI tests only if an iPhone 18 Pro with iOS 27 is already installed. No runtime download."
        required: false
        type: boolean
        default: false
      run_artifact_ui_tests:
        description: "Run the two existing Artifact UI regressions plus the SVG preview swipe regression on an already-installed iOS 27 iPhone 18 Pro. No runtime download."
        required: false
        type: boolean
        default: false
      run_drawer_tests:
        description: "Run the three drawer runtime and three gesture UI regressions on an already-installed iOS 27 iPhone 18 Pro. No runtime download."
        required: false
        type: boolean
        default: false
      run_header_connector_tests:
        description: "Run the Light/Dark header fixture and two fixture-backed connector UI tests on an already-installed iOS 27 iPhone 18 Pro. No runtime download."
        required: false
        type: boolean
        default: false
      run_font_restoration_tests:
        description: "Verify original font registration, variation axes, Dynamic Type cascade sizing and Chinese heading weights on the already-installed iOS 27 iPhone 18 Pro. No runtime download."
        required: false
        type: boolean
        default: false
      run_vertical_history_scroll_probe:
        description: "Run only the long-history vertical transcript scroll UI regression on an already-installed iOS 27 iPhone 18 Pro. No runtime download."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build102:
    name: Build 102 NativeApp
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report installed Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available

      - name: Build NativeApp for iOS Simulator
        working-directory: NativeApp
        run: |
          set -o pipefail
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/build102-xcodebuild.log"

      - name: Run offline runtime tests on an installed iOS 27 simulator
        if: ${{ inputs.run_offline_tests }}
        working-directory: NativeApp
        run: |
          set -euo pipefail
          device_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
          for device in payload.get("devices", {}).get(runtime, []):
              if device.get("isAvailable") and device.get("name") == "iPhone 18 Pro":
                  print(device["udid"])
                  break
          PY
          )"
          if [[ -z "$device_id" ]]; then
            echo "::notice::No already-installed iOS 27 iPhone 16 Pro simulator. Tests skipped; no runtime download was attempted."
            exit 0
          fi
          # Boot only the runner-provided simulator; never install a runtime.
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:MyChatRuntimeTests \
            -skip-testing:MyChatRuntimeTests/MyChatRuntimeTests/testOptInLiveCustomEndpointFirstTextTiming \
            test

      - name: Run focused summary, artifact, and SVG-cache runtime tests on an installed iOS 27 simulator
        if: ${{ inputs.run_offline_summary_tests }}
        working-directory: NativeApp
        run: |
          set -euo pipefail
          device_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
          for device in payload.get("devices", {}).get(runtime, []):
              if device.get("isAvailable") and device.get("name") == "iPhone 18 Pro":
                  print(device["udid"])
                  break
          PY
          )"
          if [[ -z "$device_id" ]]; then
            echo "::notice::No already-installed iOS 27 iPhone 18 Pro simulator. Public-summary runtime tests skipped; no runtime download was attempted."
            exit 0
          fi
          # Boot only the runner-provided simulator; never install a runtime.
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testPublicSummaryPreviewAdvancesWithActualLatestParagraphAndSentence \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testPublicSummaryPreviewKeepsOnlyExplicitPublicTextAndHandlesEmptyValues \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testArtifactDocumentCountsPreserveNativeRenderingDecision \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testArtifactSourcePreparationCachePreservesPartialSVGAndCompletion \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testStreamingArtifactCachesSourceAcrossUnchangedUpdatesAndAppearanceChanges \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testStreamingArtifactPatchesSameCanvasWithoutDroppingDrawnNodes \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testStreamingArtifactRetainsAnimationAcrossUnkeyedInsertionAndCompletion \
            -only-testing:MyChatRuntimeTests/MyChatRuntimeTests/testCompletedHTMLArtifactRunsInteractionInsideOpaqueSandbox \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run focused offline UI tests on an installed iOS 27 simulator
        if: ${{ inputs.run_offline_ui_tests }}
        working-directory: NativeApp
        run: |
          set -euo pipefail
          device_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
          for device in payload.get("devices", {}).get(runtime, []):
              if device.get("isAvailable") and device.get("name") == "iPhone 18 Pro":
                  print(device["udid"])
                  break
          PY
          )"
          if [[ -z "$device_id" ]]; then
            echo "::notice::No already-installed iOS 27 iPhone 18 Pro simulator. UI tests skipped; no runtime download was attempted."
            exit 0
          fi
          # Boot only the runner-provided simulator; never install a runtime.
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:MyChatUITests/MyChatUITests/testComposerButtonsAcceptSmallHorizontalTouchDrift \
            -only-testing:MyChatUITests/MyChatUITests/testComposerSheetsReopenAfterSelectingConversation \
            -only-testing:MyChatUITests/MyChatUITests/testComposerSheetsOpenFromNewAndExistingChatsWithKeyboard \
            -only-testing:MyChatUITests/MyChatUITests/testShortGentleSwipesOpenAndCloseDrawerFromAnywhere \
            -only-testing:MyChatUITests/MyChatUITests/testArtifactPreviewEdgeSwipeCancelsAndReturnsRepeatedly \
            -only-testing:MyChatUITests/MyChatUITests/testArtifactLibraryOpensAndDismissesPreviewRepeatedly \
            -only-testing:MyChatUITests/MyChatUITests/testSidebarSelectionTraitTracksDestination \
            -only-testing:MyChatUITests/MyChatUITests/testPasswordAndPrivacyShareOneSettingsEntry \
            -only-testing:MyChatUITests/MyChatUITests/testComposerTouchTargetsAndHapticPreferencePersist \
            -only-testing:MyChatUITests/MyChatUITests/testReasoningSummaryShowsProviderPreviewAndReopensInBothAppearances \
            test
      - name: Run focused Artifact and SVG UI tests on an installed iOS 27 simulator
        if: ${{ inputs.run_artifact_ui_tests }}
        working-directory: NativeApp
        run: |
          set -euo pipefail
          device_id="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
          for device in payload.get("devices", {}).get(runtime, []):
              if device.get("isAvailable") and device.get("name") == "iPhone 18 Pro":
                  print(device["udid"])
                  break
          PY
          )"
          if [[ -z "$device_id" ]]; then
            echo "::notice::No already-installed iOS 27 iPhone 18 Pro simulator. Artifact UI tests skipped; no runtime download was attempted."
            exit 0
          fi
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:MyChatUITests/MyChatUITests/testArtifactPreviewEdgeSwipeCancelsAndReturnsRepeatedly \
            -only-testing:MyChatUITests/MyChatUITests/testArtifactLibraryOpensAndDismissesPreviewRepeatedly \
            -only-testing:MyChatUITests/MyChatUITests/testSVGArtifactPreviewEdgeSwipeCancelsAndReturnsRepeatedly \
            test

      - name: Run focused drawer runtime and UI tests on an installed iOS 27 simulator
