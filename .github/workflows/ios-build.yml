name: Build 102 NativeApp (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build102:
    name: Build 102 NativeApp
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report installed Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list runtimes available

      - name: Build NativeApp for iOS Simulator
        working-directory: NativeApp
        run: |
          set -o pipefail
          xcodebuild \
            -project MyChatIOS.xcodeproj \
            -scheme MyChatIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/build102-xcodebuild.log"
