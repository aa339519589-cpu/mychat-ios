name: Fix sidebar gesture conflict

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-sidebar-gesture.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sidebar gesture arbitration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("MyChatIOS/RootView.swift")
          text = path.read_text()

          replacements = [
              (
                  '''    let newConversation: () -> Void
    let openDestination: (WorkspaceDestination) -> Void

    var body: some View {''',
                  '''    let newConversation: () -> Void
    let openDestination: (WorkspaceDestination) -> Void
    @State private var dragAxis: Axis?
    @State private var blocksConversationSelection = false

    var body: some View {'''
              ),
              (
                  '''                                guard value.translation.width > 54,
                                      abs(value.translation.height) < 90 else { return }''',
                  '''                                guard value.translation.width > 54,
                                      value.translation.width > abs(value.translation.height) else { return }'''
              ),
              (
                  '''                                Button {
                                    lightHaptic()
                                    select(conversation)
                                } label: {''',
                  '''                                Button {
                                    guard !blocksConversationSelection else { return }
                                    lightHaptic()
                                    select(conversation)
                                } label: {'''
              ),
              (
                  '''                        .padding(.horizontal, 12)
                    }

                    HStack {''',
                  '''                        .padding(.horizontal, 12)
                        .allowsHitTesting(!blocksConversationSelection)
                    }
                    .scrollDisabled(isHorizontalDragging)

                    HStack {'''
              ),
              (
                  '''                .frame(width: min(350, geometry.size.width * 0.86))
                .background(AppPalette.sidebar)
                .gesture(
                    DragGesture(minimumDistance: 18)
                        .onEnded { value in
                            guard value.translation.width < -48 else { return }
                            close()
                        }
                )
            }
        }
    }
}''',
                  '''                .frame(width: min(350, geometry.size.width * 0.86))
                .background(AppPalette.sidebar)
                .simultaneousGesture(sidebarDragGesture)
            }
        }
    }

    private var isHorizontalDragging: Bool {
        dragAxis == .horizontal
    }

    private var sidebarDragGesture: some Gesture {
        DragGesture(minimumDistance: 10, coordinateSpace: .local)
            .onChanged { value in
                guard dragAxis == nil else { return }
                let horizontalDistance = abs(value.translation.width)
                let verticalDistance = abs(value.translation.height)
                guard max(horizontalDistance, verticalDistance) >= 10 else { return }

                dragAxis = horizontalDistance > verticalDistance ? .horizontal : .vertical
                if dragAxis == .horizontal {
                    blocksConversationSelection = true
                }
            }
            .onEnded { value in
                let shouldClose = dragAxis == .horizontal && value.translation.width < -48
                let shouldKeepBlockingSelection = blocksConversationSelection
                dragAxis = nil

                if shouldClose {
                    close()
                }

                guard shouldKeepBlockingSelection else { return }
                DispatchQueue.main.asyncAfter(deadline: .now() + 0.15) {
                    blocksConversationSelection = false
                }
            }
    }
}'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify isolated change
        shell: bash
        run: |
          git diff --check
          bash scripts/verify-ui-contract.sh
          changed="$(git diff --name-only)"
          test "$changed" = "MyChatIOS/RootView.swift"
          grep -Fq '@State private var dragAxis: Axis?' MyChatIOS/RootView.swift
          grep -Fq '.scrollDisabled(isHorizontalDragging)' MyChatIOS/RootView.swift
          grep -Fq 'guard !blocksConversationSelection else' MyChatIOS/RootView.swift
          grep -Fq '.simultaneousGesture(sidebarDragGesture)' MyChatIOS/RootView.swift

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MyChatIOS/RootView.swift
          git rm .github/workflows/fix-sidebar-gesture.yml
          git commit -m "Fix sidebar gesture conflicts"
          git push origin main
