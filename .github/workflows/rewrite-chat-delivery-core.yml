name: Rewrite chat delivery core source

on:
  push:
    branches:
      - rewrite/chat-delivery-core-20260729

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.head_commit.message != 'Rewrite chat delivery core [source]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/chat-delivery-core-20260729
      - name: Replace the chat delivery implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('MyChatIOS/APIClient.swift')
          text = api.read_text()

          start = text.index('    func eventStream(_ accepted: ChatEnqueueResponse)')
          end = text.index('    private struct JobSnapshot {', start)
          replacement = '''    func eventStream(_ accepted: ChatEnqueueResponse) -> AsyncThrowingStream<JobEvent, Error> {
              AsyncThrowingStream { continuation in
                  let task = Task {
                      do {
                          let terminal = try await self.waitForTerminalJob(accepted.jobId)
                          continuation.yield(terminal)
                          continuation.finish()
                      } catch is CancellationError {
                          continuation.finish()
                      } catch {
                          continuation.finish(
                              throwing: self.localizedNetworkError(error, host: self.baseURL.host)
                          )
                      }
                  }
                  continuation.onTermination = { _ in task.cancel() }
              }
          }

          private func waitForTerminalJob(_ jobID: UUID) async throws -> JobEvent {
              let deadline = Date().addingTimeInterval(20 * 60)
              var delayNanoseconds: UInt64 = 350_000_000
              var lastError: Error?

              while !Task.isCancelled && Date() < deadline {
                  do {
                      let snapshot = try await readJobSnapshot(jobID)
                      lastError = nil
                      switch snapshot.status {
                      case "completed":
                          guard let result = snapshot.result?.object,
                                let content = result["content"]?.string,
                                !content.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                              throw APIError.message("模型已完成，但回复内容为空")
                          }
                          return snapshot.terminalEvent(
                              sequence: max(1, snapshot.eventSequence + 1)
                          )
                      case "failed", "cancelled":
                          return snapshot.terminalEvent(
                              sequence: max(1, snapshot.eventSequence + 1)
                          )
                      default:
                          delayNanoseconds = min(
                              1_500_000_000,
                              delayNanoseconds + 150_000_000
                          )
                      }
                  } catch is CancellationError {
                      throw CancellationError()
                  } catch {
                      lastError = error
                      guard shouldRetryJobRead(error) else { throw error }
                      delayNanoseconds = min(
                          3_000_000_000,
                          max(700_000_000, delayNanoseconds * 2)
                      )
                  }
                  try await Task.sleep(nanoseconds: delayNanoseconds)
              }

              try Task.checkCancellation()
              if let lastError { throw lastError }
              throw APIError.message("模型回复等待超时")
          }

'''
          text = text[:start] + replacement + text[end:]

          decode_start = text.find('    private func decodeEvent(')
          if decode_start != -1:
              decode_end = text.index('    private func loadBootstrap()', decode_start)
              text = text[:decode_start] + text[decode_end:]

          stream_start = text.find('    private func streamBytes(for request: URLRequest)')
          if stream_start != -1:
              stream_end = text.index('    private func send<T: Decodable>', stream_start)
              text = text[:stream_start] + text[stream_end:]

          forbidden = [
              'consumeEvents(',
              'consumeConnection(',
              'pollJobUntilTerminal(',
              'text/event-stream',
              'streamBytes(for',
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'old chat transport remains: {value}')
          if text.count('func eventStream(') != 1 or 'waitForTerminalJob' not in text:
              raise SystemExit('new chat delivery core was not installed exactly once')
          api.write_text(text)

          root = Path('MyChatIOS/RootView.swift')
          root_text = root.read_text()
          old_loop = '''                let stream = await api.eventStream(accepted)
                  for try await event in stream {
                      if event.kind == "text.delta", let delta = event.payload["text"]?.string {
                          append(delta, to: assistantID)
                      }
                      if event.kind == "thinking.delta",
                         let delta = event.payload["thinking"]?.string {
                          appendThinking(delta, to: assistantID)
                      }
                      if event.kind == "job.retry_scheduled" {
                          resetAssistant(assistantID)
                      }
                      if event.kind == "job.warning", let message = event.payload["message"]?.string {
                          error = message
                      }
                      if event.kind == "job.terminal",
                         let status = event.payload["status"]?.string,
                         status != "completed" {
                          throw APIError.message(event.payload["error"]?.message ?? "生成未完成")
                      }
                      if event.kind == "job.terminal",
                         let result = event.payload["result"]?.object {
                          applyTerminal(result, to: assistantID)
                      }
                  }
'''
          new_loop = '''                let stream = await api.eventStream(accepted)
                  for try await event in stream {
                      guard event.kind == "job.terminal",
                            let status = event.payload["status"]?.string else { continue }
                      guard status == "completed" else {
                          throw APIError.message(event.payload["error"]?.message ?? "生成未完成")
                      }
                      guard let result = event.payload["result"]?.object else {
                          throw APIError.message("模型回复结果无法识别")
                      }
                      applyTerminal(result, to: assistantID)
                  }
'''
          if old_loop not in root_text:
              raise SystemExit('ChatStore event loop no longer matches expected source')
          root_text = root_text.replace(old_loop, new_loop, 1)

          old_refresh = '''    private func refresh(conversationID: UUID) async throws {
              failedMessageID = nil
              retryContext = nil
              messages = try await api.messages(conversationID: conversationID)
              conversations = try await api.conversations()
              selectedConversation = conversations.first(where: { $0.id == conversationID })
                  ?? selectedConversation
          }
'''
          new_refresh = '''    private func refresh(conversationID: UUID) async throws {
              failedMessageID = nil
              retryContext = nil
              conversations = try await api.conversations()
              selectedConversation = conversations.first(where: { $0.id == conversationID })
                  ?? selectedConversation
          }
'''
          if old_refresh not in root_text:
              raise SystemExit('ChatStore refresh no longer matches expected source')
          root.write_text(root_text.replace(old_refresh, new_refresh, 1))

          workflow = Path('.github/workflows/ios-build.yml')
          workflow_text = workflow.read_text()
          workflow_text = workflow_text.replace(
              '      - name: Apply authoritative job recovery\n'
              '        run: python3 scripts/patch-authoritative-job-recovery.py MyChatIOS/APIClient.swift\n',
              '',
          )
          workflow.write_text(workflow_text)

          Path('scripts/patch-authoritative-job-recovery.py').unlink(missing_ok=True)

          contract = Path('scripts/verify-ui-contract.sh')
          contract_text = contract.read_text()
          if 'api_client="$repo_root/MyChatIOS/APIClient.swift"' not in contract_text:
              contract_text = contract_text.replace(
                  'info_plist="$repo_root/MyChatIOS/Info.plist"\n',
                  'info_plist="$repo_root/MyChatIOS/Info.plist"\n'
                  'api_client="$repo_root/MyChatIOS/APIClient.swift"\n',
              )
          check = '''
          require_text "$api_client" "private func waitForTerminalJob"
          if regex_search 'consumeEvents|consumeConnection|pollJobUntilTerminal|text/event-stream|streamBytes\\(for|patch-authoritative-job-recovery' "$repo_root"; then
            echo "Retired chat delivery or build-time patching is still referenced"
            exit 1
          fi
          '''
          if 'Retired chat delivery or build-time patching is still referenced' not in contract_text:
              contract_text = contract_text.replace(
                  '\necho "UI contract checks passed"\n',
                  '\n' + check + '\necho "UI contract checks passed"\n',
              )
          contract.write_text(contract_text)

          Path('.github/workflows/rewrite-chat-delivery-core.yml').unlink()
          PY
      - name: Validate rewritten source
        run: |
          bash scripts/verify-ui-contract.sh
          git diff --check
      - name: Commit direct source implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rewrite chat delivery core [source]'
          git push origin HEAD:rewrite/chat-delivery-core-20260729
