name: Production model smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  model-smoke:
    if: github.head_ref == 'diagnostics/model-smoke-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: https://ai-git-fix-quota-null-model-a-7ec528-aa339519589-4768s-projects.vercel.app
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_yYWthfTKT4K0vYT-dKPFLQ_gavblOSj
    steps:
      - name: Create isolated test session
        run: |
          set -euo pipefail
          auth_file="$RUNNER_TEMP/auth.json"
          test_email="mychat-smoke-$(python3 -c 'import uuid; print(uuid.uuid4().hex)')@example.invalid"
          test_password="Smoke-$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')-7aA!"
          jq -n --arg email "$test_email" --arg password "$test_password" \
            '{email: $email, password: $password, data: {purpose: "mychat-ios-model-smoke"}}' \
            > "$RUNNER_TEMP/signup.json"
          status="$(curl --silent --show-error --output "$auth_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' \
            --request POST --data-binary "@$RUNNER_TEMP/signup.json" \
            "$SUPABASE_URL/auth/v1/signup")"
          access_token="$(jq -r '.access_token // .session.access_token // empty' "$auth_file")"
          if [[ "$status" -lt 200 || "$status" -ge 300 || -z "$access_token" ]]; then
            jq -r '.msg // .message // .error_description // "test authentication did not return a session"' "$auth_file"
            exit 1
          fi
          echo "::add-mask::$access_token"
          printf '%s' "$access_token" > "$RUNNER_TEMP/access-token"
          chmod 600 "$RUNNER_TEMP/access-token"

      - name: Enqueue model request through fixed runtime
        run: |
          set -euo pipefail
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          conversation_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          user_message_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          assistant_message_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          generation_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          jq -n \
            --arg conversationId "$conversation_id" \
            --arg userMessageId "$user_message_id" \
            --arg assistantMessageId "$assistant_message_id" \
            --arg generationId "$generation_id" \
            '{
              conversationId: $conversationId,
              userMessageId: $userMessageId,
              assistantMessageId: $assistantMessageId,
              generationId: $generationId,
              messages: [{id: $userMessageId, role: "user", content: "Reply with exactly MYCHAT_IOS_MODEL_OK"}],
              tier: "绝句",
              searchMode: "off",
              historyRetrieval: false,
              deepResearch: false,
              turn: {schemaVersion: 1, createConversation: true, title: "iOS model smoke", projectId: null}
            }' > "$RUNNER_TEMP/chat-request.json"
          response_file="$RUNNER_TEMP/chat-response.json"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 90 \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --header "Idempotency-Key: chat:$generation_id" \
            --request POST --data-binary "@$RUNNER_TEMP/chat-request.json" \
            "$APP_URL/api/chat")"
          if [[ "$status" != "202" && "$status" != "200" ]]; then
            echo "chat enqueue HTTP status: $status"
            jq -r 'if (.error | type) == "object" then (.error.message // (.error | tostring)) else (.error // .message // "chat enqueue failed") end' "$response_file" 2>/dev/null || cat "$response_file"
            exit 1
          fi
          job_id="$(jq -r '.jobId // empty' "$response_file")"
          test "$job_id" = "$generation_id"
          printf '%s' "$job_id" > "$RUNNER_TEMP/job-id"
          printf '%s' "$assistant_message_id" > "$RUNNER_TEMP/assistant-message-id"

      - name: Wait for authoritative model result
        run: |
          set -euo pipefail
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          job_id="$(cat "$RUNNER_TEMP/job-id")"
          job_file="$RUNNER_TEMP/job.json"
          for attempt in $(seq 1 240); do
            status="$(curl --silent --show-error --output "$job_file" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $access_token" \
              --header 'Accept: application/json' \
              "$APP_URL/api/v1/jobs/$job_id")"
            test "$status" = "200"
            state="$(jq -r '.job.status // empty' "$job_file")"
            case "$state" in
              completed)
                jq -e '.job.result != null' "$job_file" >/dev/null
                echo "Model job completed with authoritative result."
                exit 0
                ;;
              failed|cancelled)
                jq -r 'if (.job.error | type) == "object" then (.job.error.message // (.job.error | tostring)) else (.job.error // .job.errorCode // "model job failed") end' "$job_file"
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "model job timed out"
          exit 1

      - name: Verify assistant message was persisted
        run: |
          set -euo pipefail
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          assistant_message_id="$(cat "$RUNNER_TEMP/assistant-message-id")"
          message_file="$RUNNER_TEMP/message.json"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $access_token" \
            --header 'Accept: application/json' \
            "$SUPABASE_URL/rest/v1/messages?select=id,content,thinking&id=eq.$assistant_message_id" \
            > "$message_file"
          jq -e 'length == 1 and (.[0].content | type == "string" and length > 0)' "$message_file" >/dev/null
          content_length="$(jq -r '.[0].content | length' "$message_file")"
          echo "Persisted assistant content length: $content_length"

      - name: Remove isolated smoke conversation
        if: always()
        run: |
          set +e
          test -f "$RUNNER_TEMP/access-token" || exit 0
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          curl --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $access_token" \
            --request DELETE \
            "$APP_URL/api/conversations"
          curl --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $access_token" \
            --request POST \
            "$SUPABASE_URL/auth/v1/logout"
