name: Production model smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  model-smoke:
    if: github.head_ref == 'diagnostics/model-smoke-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: https://mychat-nm6x.onrender.com
      SUPABASE_URL: https://usibkqqksgwgvdiqwpyo.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_yYWthfTKT4K0vYT-dKPFLQ_gavblOSj
    steps:
      - name: Create isolated test session
        run: |
          set -euo pipefail
          auth_file="$RUNNER_TEMP/auth.json"
          status="$(curl --silent --show-error --output "$auth_file" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"data":{"purpose":"mychat-ios-model-smoke"},"gotrue_meta_security":{}}' \
            "$SUPABASE_URL/auth/v1/signup")"
          access_token="$(jq -r '.access_token // .session.access_token // empty' "$auth_file")"
          if [[ -z "$access_token" ]]; then
            test_email="mychat-smoke-$(python3 -c 'import uuid; print(uuid.uuid4().hex)')@example.invalid"
            test_password="Smoke-$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')-7aA!"
            jq -n --arg email "$test_email" --arg password "$test_password" \
              '{email: $email, password: $password, data: {purpose: "mychat-ios-model-smoke"}}' \
              > "$RUNNER_TEMP/signup.json"
            status="$(curl --silent --show-error --output "$auth_file" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 60 \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --header 'Content-Type: application/json' \
              --request POST --data-binary "@$RUNNER_TEMP/signup.json" \
              "$SUPABASE_URL/auth/v1/signup")"
            access_token="$(jq -r '.access_token // .session.access_token // empty' "$auth_file")"
          fi
          user_id="$(jq -r '.user.id // .session.user.id // empty' "$auth_file")"
          if [[ "$status" -lt 200 || "$status" -ge 300 || -z "$access_token" || -z "$user_id" ]]; then
            jq -r '.msg // .message // .error_description // "test authentication did not return a session"' "$auth_file"
            exit 1
          fi
          echo "::add-mask::$access_token"
          printf '%s' "$access_token" > "$RUNNER_TEMP/access-token"
          printf '%s' "$user_id" > "$RUNNER_TEMP/user-id"
          chmod 600 "$RUNNER_TEMP/access-token" "$RUNNER_TEMP/user-id"

      - name: Create isolated quota profile
        run: |
          set -euo pipefail
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          user_id="$(cat "$RUNNER_TEMP/user-id")"
          jq -n --arg user_id "$user_id" '{user_id: $user_id}' > "$RUNNER_TEMP/profile.json"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/profile-response.json" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --header 'Prefer: return=minimal' \
            --request POST --data-binary "@$RUNNER_TEMP/profile.json" \
            "$SUPABASE_URL/rest/v1/profiles")"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "profile insert HTTP status: $status"
            cat "$RUNNER_TEMP/profile-response.json"
            exit 1
          fi

      - name: Enqueue production model request
        run: |
          set -euo pipefail
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          conversation_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          user_message_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          assistant_message_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          generation_id="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          jq -n \
            --arg conversationId "$conversation_id" \
            --arg userMessageId "$user_message_id" \
            --arg assistantMessageId "$assistant_message_id" \
            --arg generationId "$generation_id" \
            '{conversationId:$conversationId,userMessageId:$userMessageId,assistantMessageId:$assistantMessageId,generationId:$generationId,messages:[{id:$userMessageId,role:"user",content:"你好"}],tier:"正构",searchMode:"off",historyRetrieval:false,deepResearch:false,turn:{schemaVersion:1,createConversation:true,title:"iOS latency smoke",projectId:null}}' > "$RUNNER_TEMP/chat-request.json"
          started="$(date +%s)"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/chat-response.json" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 90 \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: chat:$generation_id" \
            --request POST --data-binary "@$RUNNER_TEMP/chat-request.json" \
            "$APP_URL/api/chat")"
          test "$status" = "202" -o "$status" = "200"
          job_id="$(jq -r '.jobId // empty' "$RUNNER_TEMP/chat-response.json")"
          test "$job_id" = "$generation_id"
          printf '%s' "$job_id" > "$RUNNER_TEMP/job-id"
          printf '%s' "$assistant_message_id" > "$RUNNER_TEMP/assistant-message-id"
          printf '%s' "$started" > "$RUNNER_TEMP/started-at"

      - name: Measure authoritative completion latency
        run: |
          set -euo pipefail
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          job_id="$(cat "$RUNNER_TEMP/job-id")"
          started="$(cat "$RUNNER_TEMP/started-at")"
          for attempt in $(seq 1 180); do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/job.json" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 \
              --header "Authorization: Bearer $access_token" \
              "$APP_URL/api/v1/jobs/$job_id")"
            test "$status" = "200"
            state="$(jq -r '.job.status // empty' "$RUNNER_TEMP/job.json")"
            event_sequence="$(jq -r '.job.eventSequence // 0' "$RUNNER_TEMP/job.json")"
            job_attempt="$(jq -r '.job.attempt // 0' "$RUNNER_TEMP/job.json")"
            elapsed="$(( $(date +%s) - started ))"
            echo "elapsed=${elapsed}s state=$state attempt=$job_attempt events=$event_sequence"
            case "$state" in
              completed)
                jq -e '.job.result.content | type == "string" and length > 0' "$RUNNER_TEMP/job.json" >/dev/null
                echo "MODEL_COMPLETED_SECONDS=$elapsed"
                test "$elapsed" -le 90
                exit 0 ;;
              failed|cancelled)
                cat "$RUNNER_TEMP/job.json"
                exit 1 ;;
            esac
            sleep 2
          done
          cat "$RUNNER_TEMP/job.json"
          exit 1

      - name: Remove isolated smoke conversation
        if: always()
        run: |
          set +e
          test -f "$RUNNER_TEMP/access-token" || exit 0
          access_token="$(cat "$RUNNER_TEMP/access-token")"
          curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $access_token" --request DELETE "$APP_URL/api/conversations"
          curl --silent --show-error --output /dev/null --connect-timeout 10 --max-time 30 \
            --header "apikey: $SUPABASE_ANON_KEY" --header "Authorization: Bearer $access_token" \
            --request POST "$SUPABASE_URL/auth/v1/logout"
